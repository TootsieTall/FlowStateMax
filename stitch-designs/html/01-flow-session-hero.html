<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ffc757",
                        "background-light": "#f8f7f5",
                        "background-dark": "#1a1a2e",
                        "accent-indigo": "#2d2d5a",
                        "accent-orange": "#FF8C42"
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .starfield {
            background-image: radial-gradient(white 1px, transparent 0);
            background-size: 50px 50px;
        }
        .glow-aura {
            box-shadow: 0 0 100px 40px rgba(255, 140, 66, 0.4);
        }
    </style>
</head>
<body class="bg-background-dark font-display overflow-hidden">
<!-- Immersive Background -->
<div class="fixed inset-0 bg-gradient-to-b from-[#1a1a2e] via-[#2d2d5a] to-[#1a1a2e] z-0">
<div class="absolute inset-0 starfield opacity-20"></div>
</div>
<!-- Main Content Container -->
<main class="relative z-10 h-screen w-full flex flex-col items-center justify-between py-12 px-6">
<!-- Top Bar -->
<div class="w-full flex justify-end items-start">
<button class="p-3 bg-white/10 hover:bg-white/20 rounded-full backdrop-blur-md transition-all text-slate-100 group">
<span class="material-symbols-outlined text-3xl">open_in_full</span>
</button>
</div>
<!-- Center Timer Section -->
<div class="flex flex-col items-center text-center">
<div class="flex gap-4 items-center mb-4">
<div class="flex flex-col items-center">
<span class="text-[120px] md:text-[180px] font-extrabold leading-none text-white tracking-tighter">34:55</span>
</div>
</div>
<div class="bg-primary/20 backdrop-blur-md px-6 py-2 rounded-full border border-primary/30">
<h2 class="text-primary text-xl font-bold tracking-widest uppercase">Deep Work Session</h2>
</div>
</div>
<!-- Sunrise Element -->
<div class="absolute bottom-[-150px] w-[600px] h-[600px] bg-accent-orange rounded-full glow-aura flex items-start justify-center pt-20">
<!-- Optional subtle texture for the sun -->
<div class="w-full h-full opacity-10 bg-[radial-gradient(circle,_transparent_20%,_#000_100%)]"></div>
</div>
<!-- Expanded Control Panel (Floating Overlay Positioned Bottom) -->
<div class="w-full max-w-lg mb-4 bg-background-dark/80 backdrop-blur-xl border border-slate-700/50 rounded-xl p-6 shadow-2xl relative z-20">
<div class="flex items-center justify-between mb-6">
<div class="flex items-center gap-2">
<span class="flex h-3 w-3 rounded-full bg-primary animate-pulse"></span>
<span class="text-primary font-bold text-sm tracking-wide uppercase">Flow Session Active</span>
</div>
<div class="flex gap-3">
<button class="text-slate-400 hover:text-white"><span class="material-symbols-outlined text-xl">palette</span></button>
<button class="text-slate-400 hover:text-white"><span class="material-symbols-outlined text-xl">grid_view</span></button>
<button class="text-slate-400 hover:text-white"><span class="material-symbols-outlined text-xl">notifications_off</span></button>
</div>
</div>
<!-- Action Buttons -->
<div class="grid grid-cols-2 gap-4 mb-8">
<button class="bg-white/10 hover:bg-white/20 text-white font-semibold py-4 rounded-xl transition-all border border-white/10">
                    Take Break ☕
                </button>
<button class="bg-primary hover:bg-primary/90 text-background-dark font-bold py-4 rounded-xl transition-all shadow-lg shadow-primary/20">
                    Complete Session
                </button>
</div>
<!-- Quote -->
<div class="border-t border-slate-700/50 pt-6">
<p class="text-slate-300 italic text-sm text-center leading-relaxed">
                    "Deep work is the ability to focus without distraction on a cognitively demanding task."
                </p>
<p class="text-primary text-[10px] text-center mt-2 font-bold uppercase tracking-tighter">
                    — Cal Newport
                </p>
</div>
</div>
</main>
<!-- Visual Polish: Decorative Gradients -->
<div class="fixed top-0 left-0 w-full h-32 bg-gradient-to-b from-background-dark to-transparent pointer-events-none"></div>
<div class="fixed inset-0 pointer-events-none border-[16px] border-white/5"></div>
</body></html>
