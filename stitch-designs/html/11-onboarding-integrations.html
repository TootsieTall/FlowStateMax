<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Daybreak Onboarding - Step 3</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ffc757",
                        "background-light": "#f8f7f5",
                        "background-dark": "#000000",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .golden-glow {
            box-shadow: 0 0 30px rgba(255, 199, 87, 0.15);
            border: 1px solid rgba(255, 199, 87, 0.3);
        }
        .card-selected {
            border: 1px solid #ffc757 !important;
            box-shadow: 0 0 20px rgba(255, 199, 87, 0.3);
            background: rgba(255, 199, 87, 0.08) !important;
        }
        .orange-gradient {
            background: linear-gradient(135deg, #ffc757 0%, #ff9800 100%);
        }
        .text-gradient-gold {
            background: linear-gradient(135deg, #ffc757 0%, #ff9800 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>

<div class="relative w-full max-w-2xl">
<!-- Main Onboarding Card -->
<div class="bg-[#1E1E1E] backdrop-blur-md rounded-2xl p-8 md:p-14 golden-glow">
<!-- Header Section -->
<header class="text-center mb-10">
<div class="flex justify-center mb-6">
<div class="size-10 text-primary">
<svg fill="none" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<path d="M6 6H42L36 24L42 42H6L12 24L6 6Z" fill="currentColor"></path>
</svg>
</div>
</div>
<p class="text-primary text-[10px] font-black tracking-[0.4em] uppercase mb-4 opacity-80">Step 3 of 8</p>
<h1 class="text-3xl md:text-5xl font-black leading-tight tracking-tight text-gradient-gold mb-2">
                    Connect your world 🔌
                </h1>
<p class="text-slate-400 mt-4 text-sm md:text-lg font-medium opacity-60">Sync your schedules to stay ahead of the day.</p>
</header>
<!-- Selection Grid -->
<div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-10">
<!-- Google Calendar -->
<div class="group relative flex flex-col items-center gap-5 p-8 rounded-2xl border border-white/5 bg-white/5 card-selected cursor-pointer transition-all duration-300">
<div class="absolute top-4 right-4 text-primary">
<span class="material-symbols-outlined text-lg fill-1">check_circle</span>
</div>
<div class="w-14 h-14 rounded-xl bg-white/10 flex items-center justify-center p-3">
<svg class="w-full h-full" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M19 3H5C3.89 3 3 3.9 3 5V19C3 20.1 3.89 21 5 21H19C20.11 21 21 20.1 21 19V5C21 3.9 20.11 3 19 3M19 19H5V8H19V19M7 10H9V12H7V10M11 10H13V12H11V10M15 10H17V12H15V10M7 14H9V16H7V14M11 14H13V16H11V14M15 14H17V16H15V14Z" fill="white"></path>
</svg>
</div>
<div class="text-center">
<p class="text-white text-sm font-bold tracking-wide">Google</p>
<p class="text-slate-500 text-[10px] uppercase tracking-widest mt-1">Calendar</p>
</div>
</div>
<!-- Outlook -->
<div class="group relative flex flex-col items-center gap-5 p-8 rounded-2xl border border-white/5 bg-white/5 cursor-pointer hover:border-white/20 transition-all duration-300">
<div class="w-14 h-14 rounded-xl bg-white/10 flex items-center justify-center p-3">
<svg class="w-full h-full" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12,2L4.5,20.29L5.21,21L12,18L18.79,21L19.5,20.29L12,2Z" fill="white"></path>
</svg>
</div>
<div class="text-center">
<p class="text-white text-sm font-bold tracking-wide">Outlook</p>
<p class="text-slate-500 text-[10px] uppercase tracking-widest mt-1">Calendar</p>
</div>
</div>
<!-- Apple Calendar -->
<div class="group relative flex flex-col items-center gap-5 p-8 rounded-2xl border border-white/5 bg-white/5 cursor-pointer hover:border-white/20 transition-all duration-300">
<div class="w-14 h-14 rounded-xl bg-white/10 flex items-center justify-center p-3">
<svg class="w-full h-full" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M17.05,20.28C15.85,21.39 14.53,22 13.05,22C11.72,22 10.5,21.65 9.38,20.96C8.26,20.27 7.23,20.27 6.28,20.96C5.17,21.75 3.89,22.04 2.45,21.82C1.01,21.6 -0.11,20.92 -0.91,19.78C-1.71,18.64 -2,17.26 -1.78,15.64C-1.56,14.02 -0.83,12.69 0.41,11.64C1.65,10.59 3.08,10.07 4.7,10.07C5.92,10.07 7.07,10.42 8.16,11.12C9.25,11.82 10.23,11.82 11.1,11.12C12.21,10.23 13.54,9.79 15.09,9.79C16.86,9.79 18.38,10.42 19.64,11.68C18.23,12.51 17.53,13.75 17.53,15.39C17.53,17.03 18.17,18.36 19.46,19.37C18.73,20.48 17.93,21.12 17.05,20.28Z" fill="white" transform="translate(5, 1)"></path>

</div>
<div class="text-center">
<p class="text-white text-sm font-bold tracking-wide">Apple</p>
<p class="text-slate-500 text-[10px] uppercase tracking-widest mt-1">iCal</p>
</div>
</div></div>
<!-- Navigation Footer -->
<div class="flex flex-col items-center gap-6">
<button class="orange-gradient w-full max-w-sm py-5 rounded-2xl text-black font-black text-lg shadow-2xl shadow-primary/10 hover:scale-[1.03] active:scale-[0.97] transition-all duration-300">
                    Continue
                </button>
<button class="text-slate-400 hover:text-white font-medium text-sm transition-colors flex items-center gap-2">
<span class="material-symbols-outlined text-sm">arrow_back</span>
                    Back
                </button>
</div>
</div>
<!-- Background subtle elements -->
<div class="absolute -top-24 -left-24 w-64 h-64 bg-primary/5 rounded-full blur-[100px] pointer-events-none"></div>
<div class="absolute -bottom-24 -right-24 w-64 h-64 bg-primary/5 rounded-full blur-[100px] pointer-events-none"></div>
</div>
</body></html>
