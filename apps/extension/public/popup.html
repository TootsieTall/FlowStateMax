<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlowState</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .header {
      text-align: center;
      margin-bottom: 16px;
    }
    .title {
      font-size: 18px;
      font-weight: bold;
      color: #1976D2;
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 12px;
      color: #666;
    }
    .status {
      background: #f0f0f0;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .status-label {
      font-size: 12px;
      color: #666;
      margin-bottom: 4px;
    }
    .status-value {
      font-size: 14px;
      font-weight: 600;
      color: #333;
    }
    .status-active {
      color: #2e7d32;
    }
    .status-inactive {
      color: #999;
    }
    .button {
      width: 100%;
      padding: 10px;
      background: #1976D2;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 8px;
    }
    .button:hover {
      background: #1565C0;
    }
    .button-secondary {
      background: #f0f0f0;
      color: #333;
    }
    .button-secondary:hover {
      background: #e0e0e0;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">FlowState</div>
    <div class="subtitle">Deep Work Companion</div>
  </div>

  <div class="status">
    <div class="status-label">Session Status</div>
    <div class="status-value" id="session-status">Loading...</div>
  </div>

  <div class="status">
    <div class="status-label">Grayscale Mode</div>
    <div class="status-value" id="grayscale-status">Loading...</div>
  </div>

  <button class="button" id="open-app-btn">Open Web App</button>
  <button class="button button-secondary" id="settings-btn">Extension Settings</button>

  <script>
    // Load status
    chrome.runtime.sendMessage({ type: 'GET_SESSION_STATUS' }, (response) => {
      const sessionStatus = document.getElementById('session-status')
      const grayscaleStatus = document.getElementById('grayscale-status')

      if (response.sessionActive) {
        sessionStatus.textContent = 'Active'
        sessionStatus.classList.add('status-active')
      } else {
        sessionStatus.textContent = 'No active session'
        sessionStatus.classList.add('status-inactive')
      }

      if (response.monochromeEnabled) {
        grayscaleStatus.textContent = 'Enabled'
        grayscaleStatus.classList.add('status-active')
      } else {
        grayscaleStatus.textContent = 'Disabled'
        grayscaleStatus.classList.add('status-inactive')
      }
    })

    // Open web app
    document.getElementById('open-app-btn').addEventListener('click', () => {
      const webAppUrl = 'http://localhost:3000'
      chrome.tabs.create({ url: webAppUrl })
    })

    // Open settings
    document.getElementById('settings-btn').addEventListener('click', () => {
      chrome.runtime.openOptionsPage()
    })
  </script>
</body>
</html>
